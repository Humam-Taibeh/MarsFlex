<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarsFlex</title>
<meta name="description" content="Plan a Marswalk in Jezero Crater before the first step. A planning scenario built on public NASA and USGS data.">
<meta name="robots" content="noindex">
<!-- SPACE_URL is replaced by deploy/firebase/set_space_url.py with the address of your running app. -->
<meta http-equiv="refresh" content="1; url=__SPACE_URL__">
<style>
  :root { color-scheme: dark; --bg:#060b10; --text:#eef3f5; --muted:#9db0ba; --orange:#ff8a4c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; text-align:center; }
  main { max-width:30rem; }
  h1 { font-size:clamp(2.2rem, 8vw, 3.2rem); margin:0 0 .4rem; letter-spacing:.02em; }
  h1 span { color:var(--orange); }
  p { color:var(--muted); line-height:1.6; margin:.4rem 0 1.4rem; }
  a.btn { display:inline-block; background:var(--orange); color:#1a0e06; font-weight:700; text-decoration:none;
          padding:.8rem 1.4rem; border-radius:999px; }
  small { display:block; margin-top:1.4rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Mars<span>Flex</span></h1>
  <p>Plan a Marswalk in Jezero Crater before the first step. Opening the app now&hellip;</p>
  <a class="btn" href="__SPACE_URL__">Open MarsFlex</a>
  <small>A planning scenario, not flight-certified. Public NASA and USGS data.</small>
</main>
</body>
</html>
